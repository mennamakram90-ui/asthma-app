<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>متابعة الربو الشاملة</title>
<link rel="manifest" href="manifest.json"><meta name="theme-color" content="#6D28D9"><link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="icon-192.png">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#EEF5F6;--card:#fff;--ink:#12303A;--mut:#5B7680;--ac:#0F7C8A;--ln:#D3E2E5;--g:#2E9E5B;--y:#E3A008;--r:#D64545;--gb:#E3F5EA;--yb:#FDF3D6;--rb:#FBE3E3;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0E1B20;--card:#16282F;--ink:#E4F0F2;--mut:#93AEB6;--ac:#4FC1CF;--ln:#274149;--gb:#153824;--yb:#3A3011;--rb:#3F1B1B}}
:root[data-theme=dark]{--bg:#0E1B20;--card:#16282F;--ink:#E4F0F2;--mut:#93AEB6;--ac:#4FC1CF;--ln:#274149;--gb:#153824;--yb:#3A3011;--rb:#3F1B1B}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Tajawal,Tahoma,sans-serif;line-height:1.6;min-height:100vh}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--ac);color:#fff;display:flex;align-items:center;gap:10px;padding:10px 14px}
header h1{font-size:17px;margin:0;flex:1}
button,input,select,textarea{font:inherit;color:inherit}
.ib{background:rgba(255,255,255,.18);border:0;color:#fff;border-radius:10px;width:40px;height:40px;font-size:20px;cursor:pointer}
main{max-width:720px;margin:0 auto;padding:14px 14px 90px}
.card{background:var(--card);border:1px solid var(--ln);border-radius:14px;padding:14px;margin-bottom:12px}
h2{font-size:19px;margin:4px 0 10px}h3{font-size:16px;margin:0 0 6px}
.mut{color:var(--mut);font-size:14px}
.btn{background:var(--ac);color:#fff;border:0;border-radius:10px;padding:10px 16px;cursor:pointer;font-weight:700}
.btn.o{background:transparent;color:var(--ac);border:1.5px solid var(--ac)}.btn.d{background:var(--r)}
.btn:focus-visible,.ib:focus-visible,input:focus-visible,select:focus-visible,.nv a:focus-visible,.dr a:focus-visible{outline:3px solid var(--y);outline-offset:2px}
label{display:block;font-weight:500;margin:10px 0 4px}
input,select,textarea{width:100%;background:var(--bg);border:1.5px solid var(--ln);border-radius:10px;padding:9px}
.err{color:var(--r);font-size:13px;margin-top:4px}input.bad{border-color:var(--r)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.row>*{flex:1}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
.stat{background:var(--bg);border-radius:12px;padding:10px}.stat b{font-size:22px;display:block}
.zone{border-radius:16px;padding:18px;border:2px solid}
.zg{background:var(--gb);border-color:var(--g)}.zy{background:var(--yb);border-color:var(--y)}.zr{background:var(--rb);border-color:var(--r)}
.chip{display:inline-block;border:1.5px solid var(--ln);border-radius:20px;padding:5px 12px;margin:3px;cursor:pointer;background:var(--card)}
.chip.on{background:var(--ac);color:#fff;border-color:var(--ac)}
.opt{display:block;border:1.5px solid var(--ln);border-radius:10px;padding:8px 10px;margin:5px 0;cursor:pointer;font-weight:400}
.opt.on{border-color:var(--ac);background:var(--bg)}
.li{display:flex;justify-content:space-between;gap:8px;padding:9px 0;border-bottom:1px solid var(--ln)}.li:last-child{border:0}
.bar{height:10px;background:var(--ln);border-radius:6px;overflow:hidden}.bar i{display:block;height:100%;background:var(--ac)}
.sk{background:linear-gradient(90deg,var(--ln),var(--card),var(--ln));background-size:200% 100%;animation:sh 1.1s infinite;border-radius:12px;height:70px;margin-bottom:12px}
@keyframes sh{to{background-position:-200% 0}}
@media(prefers-reduced-motion:reduce){.sk{animation:none}}
.empty{text-align:center;padding:26px 10px}.empty .ic{font-size:44px}
.ok{text-align:center;padding:22px}.ok .ic{width:64px;height:64px;border-radius:50%;background:var(--g);color:#fff;font-size:34px;line-height:64px;margin:0 auto 8px}
.nv{position:fixed;bottom:0;inset-inline:0;background:var(--card);border-top:1px solid var(--ln);display:flex;padding-bottom:env(safe-area-inset-bottom,0px);z-index:5}
.nv a,.dr a{flex:1;text-align:center;padding:8px 2px;font-size:12px;color:var(--mut);cursor:pointer;text-decoration:none}
.nv a.on,.dr a.on{color:var(--ac);font-weight:700}.nv a span{display:block;font-size:20px}
.dr{position:fixed;inset:0;z-index:9;background:rgba(0,0,0,.45);display:none}.dr.show{display:block}
.dr nav{background:var(--card);width:270px;max-width:85%;height:100%;overflow:auto;padding:12px;margin-inline-start:0}
.dr a{display:block;text-align:start;font-size:15px;padding:10px;border-radius:10px}.dr a.on{background:var(--bg)}
#toast{position:fixed;top:70px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:10px;z-index:20;display:none}
svg{width:100%;height:auto;display:block}
@media print{header,.nv,.no{display:none!important}}
</style>
</head>
<body>
<header id="hd"><button class="ib" onclick="dr(1)" aria-label="القائمة">☰</button><h1 id="ttl">متابعة الربو</h1><button class="ib" onclick="go('emerg')" aria-label="طوارئ">🚨</button></header>
<div class="dr" id="dr" onclick="dr(0)"><nav onclick="event.stopPropagation()" id="drn"></nav></div>
<div id="toast"></div>
<main id="main"></main>
<nav class="nv" id="nv"></nav>
<script>
var P=[['login','تسجيل الدخول','🔑'],['dash','الرئيسية','🏠'],['check','التقييم اليومي','📝'],['zone','منطقتي','🚦'],['air','الطقس والهواء','🌤️'],['meds','الأدوية','💊'],['att','سجل النوبات','📒'],['pf','قياس تدفق الهواء','🫁'],['trg','محفزاتي','⚠️'],['plan','خطة العمل','📋'],['edu','التثقيف','📚'],['doc','تقرير الطبيب','🩺'],['emerg','الطوارئ','🚨'],['stat','الإحصائيات','📈'],['set','الإعدادات','⚙️']];
var S={user:null,zone:null,page:'login',ans:{},err:0,att:[],pfBest:450,
pf:[['01/10',420],['02/10',400],['03/10',380],['04/10',410],['05/10',360],['06/10',395],['07/10',430]],
meds:[{n:'بخاخ وقائي (بوديزونايد)',t:'صباحاً ومساءً',left:96,tot:120,rescue:0,taken:0},{n:'بخاخ إسعافي (سالبيوتامول)',t:'عند الحاجة فقط',left:148,tot:200,rescue:1,taken:0}],
trg:{'الغبار':1,'الفراء':0,'العطور':0,'الهواء البارد':1,'حبوب اللقاح':1,'الدخان':0,'المجهود':0,'العدوى':0},
set:{name:'',rem:1,notes:1},dark:0,open:-1,sent:0,W:null,wsrc:'demo',sim:'dust',nt:0};
var Q=[['كم مرة سعلت أو سمعت صفيراً في الصدر اليوم؟',['لم يحدث','قليلاً','كثيراً','طوال اليوم']],['هل استيقظت ليلاً بسبب الأعراض؟',['لا','مرة','مرتين','أكثر من مرتين']],['هل أثّر الربو على نشاطك اليومي؟',['لا','قليلاً','بشكل واضح','منعني من النشاط']],['كم مرة استخدمت بخاخ الطوارئ اليوم؟',['0','1 - 2','3 - 4','5 أو أكثر']]];
var ZN={g:['المنطقة الخضراء','حالتك مستقرة','zg'],y:['المنطقة الصفراء','انتبه: بداية تدهور','zy'],r:['المنطقة الحمراء','خطر: تحتاج تدخلاً فورياً','zr']};
var ZT={g:['استمر على أدويتك الوقائية','مارس نشاطك المعتاد','تجنب محفزاتك المعروفة'],y:['استخدم البخاخ الإسعافي حسب خطتك','قلل المجهود وابتعد عن المحفزات','راجع طبيبك إذا استمرت الأعراض أكثر من يوم'],r:['استخدم البخاخ الإسعافي فوراً','اتصل بالإسعاف إذا لم تتحسن خلال 15 دقيقة','لا تبقَ وحدك']};
var $=function(s){return document.querySelector(s)};
function toast(t){var e=$('#toast');e.textContent=t;e.style.display='block';setTimeout(function(){e.style.display='none'},2200)}
function dr(o){$('#dr').classList.toggle('show',!!o)}
function go(p){S.page=p;S.err=0;dr(0);$('#main').innerHTML='<div class="sk"></div><div class="sk"></div><div class="sk"></div>';draw(true);setTimeout(function(){draw()},450);window.scrollTo(0,0)}
function draw(shellOnly){save();
var lg=S.page=='login';$('#hd').style.display=lg?'none':'flex';$('#nv').style.display=lg?'none':'flex';
var cur=P.filter(function(x){return x[0]==S.page})[0];$('#ttl').textContent=cur[1];
$('#drn').innerHTML=P.slice(1).map(function(x){return '<a href="#" class="'+(x[0]==S.page?'on':'')+'" onclick="go(\''+x[0]+'\');return false">'+x[2]+' '+x[1]+'</a>'}).join('');
$('#nv').innerHTML=['dash','check','meds','stat'].map(function(k){var x=P.filter(function(y){return y[0]==k})[0];return '<a href="#" class="'+(S.page==k?'on':'')+'" onclick="go(\''+k+'\');return false"><span>'+x[2]+'</span>'+x[1].split(' ')[0]+'</a>'}).join('')+'<a href="#" onclick="dr(1);return false"><span>⋯</span>المزيد</a>';
if(!shellOnly)$('#main').innerHTML=V[S.page]()}
function zcard(z,sm){var n=ZN[z];return '<div class="zone '+n[2]+'"><h2 style="margin:0">🚦 '+n[0]+'</h2><div>'+n[1]+'</div>'+(sm?'':'<ul>'+ZT[z].map(function(t){return '<li>'+t+'</li>'}).join('')+'</ul>')+'</div>'}
function empty(i,t,d,b,p){return '<div class="card empty"><div class="ic">'+i+'</div><h3>'+t+'</h3><p class="mut">'+d+'</p>'+(b?'<button class="btn" onclick="go(\''+p+'\')">'+b+'</button>':'')+'</div>'}
function pz(v){var r=v/S.pfBest;return r>=.8?'g':r>=.5?'y':'r'}
var V={
login:function(){return '<div class="card" style="margin-top:30px"><div style="font-size:42px">🫁</div><h2>تطبيق المتابعة الشاملة لمرضى الربو</h2><p class="mut">أنشئ حسابك لتبدأ متابعة حالتك يومياً.</p><label for="nm">الاسم</label><input id="nm" placeholder="مثال: أحمد محمود"><div class="err" id="e1"></div><label for="ty">نوع الربو</label><select id="ty"><option>ربو تحسسي</option><option>ربو مجهودي</option><option>ربو مزمن مستمر</option><option>ربو الأطفال</option></select><label for="dd">تاريخ التشخيص</label><input type="date" id="dd"><div class="err" id="e2"></div><br><button class="btn" style="width:100%" onclick="login()">إنشاء الحساب والدخول</button></div>'},
dash:function(){var z=S.zone;var m=S.meds[1];return '<h2>أهلاً '+(S.user.name)+' 👋</h2>'+(z?zcard(z,1):'<div class="card"><h3>لم تُكمل تقييم اليوم</h3><p class="mut">دقيقة واحدة تكفي لمعرفة منطقتك.</p><button class="btn" onclick="go(\'check\')">ابدأ التقييم</button></div>')+''+alertBox()+'<div class="grid"><div class="stat"><span class="mut">آخر قراءة Peak Flow</span><b>'+S.pf[S.pf.length-1][1]+'</b></div><div class="stat"><span class="mut">جرعات الإسعاف المتبقية</span><b>'+m.left+'</b></div><div class="stat"><span class="mut">نوبات هذا الشهر</span><b>'+S.att.length+'</b></div></div><h3 style="margin-top:16px">وصول سريع</h3><div class="row">'+[['check','📝 تقييم'],['meds','💊 دواء'],['pf','🫁 قياس'],['att','📒 نوبة']].map(function(x){return '<button class="btn o" onclick="go(\''+x[0]+'\')">'+x[1]+'</button>'}).join('')+'</div>'},
check:function(){var h='<h2>التقييم اليومي</h2>';if(S.err)h+='<div class="card zr zone err">يرجى الإجابة على كل الأسئلة قبل الحفظ.</div>';Q.forEach(function(q,i){h+='<div class="card"><h3>'+(i+1)+'. '+q[0]+'</h3>';q[1].forEach(function(o,j){h+='<label class="opt '+(S.ans[i]===j?'on':'')+'"><input type="radio" style="width:auto" name="q'+i+'" '+(S.ans[i]===j?'checked':'')+' onchange="S.ans['+i+']='+j+';draw()"> '+o+'</label>'});if(S.err&&S.ans[i]===undefined)h+='<div class="err">هذا السؤال مطلوب</div>';h+='</div>'});return h+'<button class="btn" style="width:100%" onclick="submitCheck()">احسب منطقتي</button>'},
checkok:function(){return '<div class="card ok"><div class="ic">✓</div><h2>تم حفظ تقييم اليوم</h2><p class="mut">تم تحديد منطقتك بنجاح.</p><button class="btn" onclick="go(\'zone\')">عرض النتيجة</button></div>'},
zone:function(){if(!S.zone)return empty('🚦','لا توجد نتيجة بعد','أكمل التقييم اليومي لتعرف منطقتك.','ابدأ التقييم','check');return zcard(S.zone)+'<div class="card" style="margin-top:12px"><h3>ماذا تعني المناطق؟</h3><div class="li"><span>🟢 خضراء</span><span class="mut">أعراض شبه معدومة</span></div><div class="li"><span>🟡 صفراء</span><span class="mut">أعراض متزايدة</span></div><div class="li"><span>🔴 حمراء</span><span class="mut">أعراض شديدة</span></div></div><button class="btn o" onclick="go(\'plan\')">افتح خطة العمل</button>'},
air:function(){var d=[['الغبار','45 µg','مقبول','y',45],['الرطوبة','68%','مرتفعة قليلاً','y',68],['حبوب اللقاح','عالٍ','مرتفع','r',85],['التلوث AQI','92','متوسط','y',60],['الحرارة','31°م','معتدل','g',31]];return '<h2>جودة الهواء اليوم · القاهرة</h2>'+d.map(function(x){return '<div class="card"><div class="li" style="border:0;padding:0"><b>'+x[0]+'</b><span>'+x[1]+' · <span style="color:var(--'+x[3]+')">'+x[2]+'</span></span></div><div class="bar" style="margin-top:8px"><i style="width:'+x[4]+'%;background:var(--'+x[3]+')"></i></div></div>'}).join('')+'<p class="mut">بيانات تجريبية لأغراض العرض.</p>'},
meds:function(){return '<h2>أدويتي</h2>'+S.meds.map(function(m,i){var pc=Math.round(m.left/m.tot*100);return '<div class="card"><h3>'+m.n+'</h3><div class="mut">'+m.t+'</div><div class="li" style="border:0"><span>المتبقي: <b>'+m.left+'</b> من '+m.tot+'</span><span class="mut">أخذت اليوم: '+m.taken+'</span></div><div class="bar"><i style="width:'+pc+'%;background:'+(pc<25?'var(--r)':'var(--ac)')+'"></i></div><br><button class="btn" onclick="dose('+i+')">تسجيل جرعة</button></div>'}).join('')+'<div class="card"><h3>إضافة دواء</h3><input id="mn" placeholder="اسم الدواء"><div class="err" id="e1"></div><br><button class="btn o" onclick="addMed()">حفظ الدواء</button></div>'},
att:function(){var h='<h2>سجل النوبات</h2><div class="card"><label for="at">وقت النوبة</label><input type="datetime-local" id="at"><label for="as">الشدة</label><select id="as"><option>خفيفة</option><option>متوسطة</option><option>شديدة</option></select><label for="ac">المسبب المحتمل</label><select id="ac">'+Object.keys(S.trg).map(function(k){return '<option>'+k+'</option>'}).join('')+'<option>غير معروف</option></select><div class="err" id="e1"></div><br><button class="btn" onclick="addAtt()">حفظ النوبة</button></div>';if(!S.att.length)return h+empty('🌿','لا توجد نوبات مسجلة','هذا خبر جيد. سجّل أي نوبة تحدث لتكتشف أسبابها.');return h+'<div class="card">'+S.att.map(function(a){return '<div class="li"><span>'+a[0]+'</span><span>'+a[1]+' · '+a[2]+'</span></div>'}).join('')+'</div>'},
pf:function(){var h='<h2>قياس تدفق الهواء</h2><div class="card"><p class="mut">أفضل قراءة شخصية: <b>'+S.pfBest+'</b> لتر/دقيقة</p><label for="pv">القراءة الحالية</label><input type="number" id="pv" inputmode="numeric" placeholder="مثال: 400"><div class="err" id="e1"></div><br><button class="btn" onclick="addPf()">حفظ القراءة</button></div>';if(!S.pf.length)return h+empty('🫁','لا توجد قياسات','أدخل أول قراءة لتتبع وظائف رئتيك.');return h+'<div class="card">'+S.pf.slice().reverse().map(function(r){var z=pz(r[1]);return '<div class="li"><span>'+r[0]+'</span><b style="color:var(--'+z+')">'+r[1]+' · '+Math.round(r[1]/S.pfBest*100)+'%</b></div>'}).join('')+'</div>'},
trg:function(){return '<h2>محفزاتي الشخصية</h2><div class="card"><p class="mut">اضغط على ما يسبب لك الأعراض.</p>'+Object.keys(S.trg).map(function(k){return '<span class="chip '+(S.trg[k]?'on':'')+'" tabindex="0" role="button" onclick="S.trg[\''+k+'\']=!S.trg[\''+k+'\'];draw()">'+k+'</span>'}).join('')+'</div><button class="btn" onclick="toast(\'تم حفظ المحفزات ✓\')">حفظ المحفزات</button>'},
plan:function(){var s={g:['استخدم الدواء الوقائي يومياً','قِس Peak Flow صباحاً'],y:['خذ جرعتين من البخاخ الإسعافي','أعد القياس بعد 20 دقيقة','اتصل بطبيبك إذا لم تتحسن'],r:['خذ 4 جرعات من البخاخ الإسعافي فوراً','اتصل بالإسعاف 123','اجلس منتصباً وحاول الهدوء']};return '<h2>خطة العمل الطارئة</h2>'+['g','y','r'].map(function(k){return '<div class="zone '+ZN[k][2]+'" style="margin-bottom:10px"><h3>'+ZN[k][0]+'</h3><ol style="margin:0;padding-inline-start:20px">'+s[k].map(function(t){return '<li>'+t+'</li>'}).join('')+'</ol></div>'}).join('')+'<p class="mut">هذه خطة عامة للعرض. اتبع الخطة التي كتبها لك طبيبك.</p><button class="btn o no" onclick="window.print()">طباعة الخطة</button>'},
edu:function(){var a=[['كيف أستخدم البخاخ بشكل صحيح؟','ارجّ البخاخ، ازفر بهدوء، اضغط مع شهيق بطيء، ثم احبس نفسك 10 ثوانٍ. استخدم الفاصل الهوائي مع الأطفال.'],['كيف أتجنب النوبات؟','التزم بالدواء الوقائي، وتجنب محفزاتك، ونظّف الغرفة من الغبار، وراقب حالة الهواء قبل الخروج.'],['متى أذهب للطوارئ؟','إذا لم يتحسن التنفس بعد البخاخ، أو صعب عليك الكلام، أو ظهر زرقة على الشفتين.'],['الربو والرياضة','المشي والسباحة مناسبان. سخّن جسمك قبل الجهد وخذ بخاخك قبله إذا أوصى طبيبك.']];return '<h2>التثقيف والنصائح</h2>'+a.map(function(x,i){return '<div class="card" onclick="S.open=S.open=='+i+'?-1:'+i+';draw()" style="cursor:pointer"><h3>'+(S.open==i?'▾':'◂')+' '+x[0]+'</h3>'+(S.open==i?'<p>'+x[1]+'</p>':'')+'</div>'}).join('')},
doc:function(){var avg=Math.round(S.pf.reduce(function(a,b){return a+b[1]},0)/Math.max(S.pf.length,1));var h='<h2>التواصل مع الطبيب</h2><div class="card"><h3>ملخص الحالة</h3><div class="li"><span>المريض</span><b>'+S.user.name+'</b></div><div class="li"><span>نوع الربو</span><b>'+S.user.type+'</b></div><div class="li"><span>متوسط Peak Flow</span><b>'+avg+'</b></div><div class="li"><span>عدد النوبات</span><b>'+S.att.length+'</b></div><div class="li"><span>المحفزات</span><b>'+Object.keys(S.trg).filter(function(k){return S.trg[k]}).join('، ')+'</b></div></div>';if(S.sent)h+='<div class="card ok"><div class="ic">✓</div><h3>تم إرسال التقرير للطبيب</h3></div>';return h+'<div class="row no"><button class="btn" onclick="S.sent=1;toast(\'تم إرسال التقرير ✓\');draw()">إرسال للطبيب</button><button class="btn o" onclick="window.print()">حفظ PDF / طباعة</button></div>'},
emerg:function(){return '<h2>جهات اتصال الطوارئ</h2><div class="zone zr"><h3>🚑 الإسعاف</h3><a class="btn d" style="display:block;text-align:center;text-decoration:none;font-size:20px" href="tel:123">اتصل بالإسعاف 123</a></div><div class="card" style="margin-top:12px">'+[['د. سلمى عادل (الطبيبة)','01000000001'],['محمود (الأخ)','01000000002'],['أم أحمد (الوالدة)','01000000003']].map(function(c){return '<div class="li"><span>'+c[0]+'</span><a class="btn o" style="text-decoration:none" href="tel:'+c[1]+'">اتصال</a></div>'}).join('')+'</div>'},
stat:function(){var z=[1,1,2,1,1,1,2,3,2,1,1,1,1,2,1,1,2,2,1,1,1,1,1,2,1,1,1,1,2,1];var c={1:'var(--g)',2:'var(--y)',3:'var(--r)'};var bars=z.map(function(v,i){var h=v*22;return '<rect x="'+(i*11+4)+'" y="'+(80-h)+'" width="8" height="'+h+'" rx="2" fill="'+c[v]+'"/>'}).join('');var pts=S.pf.map(function(r,i){return (i*50+15)+','+(110-(r[1]-300)*0.7)}).join(' ');return '<h2>إحصائيات الشهر</h2><div class="card"><h3>المنطقة اليومية (آخر 30 يوماً)</h3><svg viewBox="0 0 340 90" role="img" aria-label="رسم المناطق">'+bars+'</svg><div class="mut">20 يوماً أخضر · 9 أصفر · 1 أحمر</div></div><div class="card"><h3>اتجاه Peak Flow</h3><svg viewBox="0 0 330 120" role="img" aria-label="رسم Peak Flow"><polyline points="'+pts+'" fill="none" stroke="var(--ac)" stroke-width="3"/></svg></div><div class="card" style="background:var(--gb)">📈 حالتك مستقرة هذا الشهر مع تحسن طفيف في الأسبوع الأخير.</div>'},
set:function(){return '<h2>الإعدادات والملف الشخصي</h2><div class="card"><label for="sn">الاسم</label><input id="sn" value="'+S.user.name+'"><div class="err" id="e1"></div><label for="st">نوع الربو</label><input id="st" value="'+S.user.type+'"><label class="opt"><input type="checkbox" style="width:auto" id="sr" '+(S.set.rem?'checked':'')+'> تذكير بمواعيد الجرعات</label><label class="opt"><input type="checkbox" style="width:auto" id="sx" '+(S.set.notes?'checked':'')+'> تنبيهات جودة الهواء</label><label class="opt"><input type="checkbox" style="width:auto" id="sd" '+(S.dark?'checked':'')+'> الوضع الداكن</label><br><button class="btn" onclick="saveSet()">حفظ التغييرات</button> <button class="btn o" onclick="S.user=null;go(\'login\')">تسجيل الخروج</button></div>'}};
var WC={lat:30.04,lon:31.24};
var DEMO={dust:{dust:260,pm10:300,pm25:90,aqi:120,pollen:20,t:36,h:25,wind:35},normal:{dust:20,pm10:35,pm25:12,aqi:30,pollen:5,t:27,h:55,wind:10}};
var AD={r:{c:'zr',t:'🔴 غبار شديد: يفضّل البقاء في المنزل اليوم',a:['أغلق النوافذ والأبواب','أجّل أي مجهود أو رياضة','تأكد من أخذ دواءك الوقائي','لو لازم تخرج: البس كمامة N95 واحمل البخاخ الإسعافي']},y:{c:'zy',t:'🟡 غبار متوسط: اخرج بحذر وبالاحتياطات',a:['البس كمامة عند الخروج','احمل البخاخ الإسعافي معك','قلل وقت التواجد بالخارج','ارجع للمنزل فوراً لو ظهرت أعراض']},g:{c:'zg',t:'🟢 الجو مناسب للخروج',a:['اخرج بشكل طبيعي','احمل بخاخك معك كعادتك']}};
function getW(){return S.wsrc=='live'&&S.W?S.W:DEMO[S.sim||'dust']}
function lvl(w){return(w.dust>=150||w.pm10>=150||w.aqi>=100)?'r':(w.dust>=50||w.pm10>=50||w.aqi>=60||w.pollen>=50)?'y':'g'}
function medList(){return 'خذ معك: '+S.meds.map(function(m){return m.n}).join('، ')}
function alertBox(){var l=lvl(getW()),n=AD[l];var ex=(S.zone&&S.zone!='g'&&l!='g')?'<div><b>حالتك اليوم ('+ZN[S.zone][0]+') تزيد الخطورة مع هذا الجو.</b></div>':'';return '<div class="zone '+n.c+'" style="margin-bottom:12px"><b>'+n.t+'</b>'+ex+'<div class="mut">'+(l=='g'?'':medList())+'</div><button class="btn o" style="margin-top:8px" onclick="go(\'air\')">تفاصيل وتوصيات</button></div>'}
function loadAir(){var u='https://air-quality-api.open-meteo.com/v1/air-quality?latitude='+WC.lat+'&longitude='+WC.lon+'&current=dust,pm10,pm2_5,european_aqi,alder_pollen,grass_pollen&timezone=auto';var u2='https://api.open-meteo.com/v1/forecast?latitude='+WC.lat+'&longitude='+WC.lon+'&current=temperature_2m,relative_humidity_2m,wind_speed_10m&timezone=auto';Promise.all([fetch(u).then(function(r){return r.json()}),fetch(u2).then(function(r){return r.json()})]).then(function(a){var c=a[0].current,w=a[1].current;S.W={dust:c.dust,pm10:c.pm10,pm25:c.pm2_5,aqi:c.european_aqi,pollen:(c.grass_pollen||0)+(c.alder_pollen||0),t:w.temperature_2m,h:w.relative_humidity_2m,wind:w.wind_speed_10m};S.wsrc='live';notify();if(S.page=='air'||S.page=='dash')draw()}).catch(function(){S.wsrc='demo'})}
function notify(){try{var l=lvl(getW());if(l!='g'&&!S.nt&&window.Notification&&Notification.permission=='granted'){S.nt=1;showN(AD[l].t,AD[l].a.join(' · '))}}catch(e){}}
function showN(t,b){if(navigator.serviceWorker&&navigator.serviceWorker.ready){navigator.serviceWorker.ready.then(function(r){r.showNotification(t,{body:b,icon:'icon-192.png'})})}else{new Notification(t,{body:b})}}
function askNotif(){try{Notification.requestPermission().then(function(p){toast(p=='granted'?'تم تفعيل الإشعارات ✓':'لم يتم السماح بالإشعارات')})}catch(e){toast('الإشعارات غير مدعومة هنا')}}
V.air=function(){var w=getW(),l=lvl(w),n=AD[l];var m=[['الغبار',w.dust+' µg/m³',w.dust,300],['PM10',w.pm10+' µg/m³',w.pm10,300],['PM2.5',w.pm25+' µg/m³',w.pm25,150],['مؤشر الجودة',w.aqi,w.aqi,150],['حبوب اللقاح',w.pollen,w.pollen,100],['الرطوبة',w.h+'%',w.h,100],['الحرارة',w.t+'°م',w.t,50],['الرياح',w.wind+' كم/س',w.wind,60]];var live=S.wsrc=='live';var h='<h2>الطقس وجودة الهواء · القاهرة</h2><div class="card" style="background:var(--'+(live?'gb':'yb')+')">'+(live?'✅ بيانات حية من Open-Meteo (مجانية)':'🧪 وضع تجريبي: الاتصال بخدمة الطقس لا يعمل داخل هذه الصفحة المنشورة. افتح الملف على جهازك أو استضفه لتظهر البيانات الحية تلقائياً.')+'</div>';if(!live)h+='<div class="card"><div class="mut">جرّب سيناريو:</div><span class="chip '+(S.sim=='dust'?'on':'')+'" onclick="S.sim=\'dust\';S.nt=0;draw()">🌪️ عاصفة ترابية</span><span class="chip '+(S.sim=='normal'?'on':'')+'" onclick="S.sim=\'normal\';S.nt=0;draw()">☀️ جو عادي</span></div>';h+='<div class="zone '+n.c+'"><h3>'+n.t+'</h3><ul>'+n.a.map(function(t){return '<li>'+t+'</li>'}).join('')+'</ul>'+(l=='g'?'':'<div><b>💊 '+medList()+'</b></div>')+'</div><div class="grid" style="margin-top:12px">'+m.map(function(x){return '<div class="stat"><span class="mut">'+x[0]+'</span><b>'+x[1]+'</b><div class="bar"><i style="width:'+Math.min(100,Math.round(x[2]/x[3]*100))+'%"></i></div></div>'}).join('')+'</div><div class="row no" style="margin-top:12px"><button class="btn" onclick="askNotif()">🔔 تفعيل الإشعارات</button><button class="btn o" onclick="loadAir();toast(\'جارٍ التحديث...\')">تحديث البيانات</button></div>';return h};
function login(){var n=$('#nm').value.trim(),d=$('#dd').value,ok=1;$('#e1').textContent=n?'':'اكتب اسمك للمتابعة';$('#e2').textContent=d?'':'اختر تاريخ التشخيص';$('#nm').className=n?'':'bad';if(!n||!d)return;S.user={name:n,type:$('#ty').value,date:d};go('dash')}
function submitCheck(){if(Object.keys(S.ans).length<Q.length){S.err=1;draw();return}var t=0;for(var k in S.ans)t+=S.ans[k];S.zone=t<=3?'g':t<=7?'y':'r';S.ans={};$('#main').innerHTML='<div class="sk"></div><div class="sk"></div>';setTimeout(function(){$('#main').innerHTML=V.checkok()},700)}
function dose(i){var m=S.meds[i];if(m.left<=0){toast('الجرعات انتهت! جدّد الدواء');return}m.left--;m.taken++;draw();toast('تم تسجيل الجرعة ✓')}
function addMed(){var n=$('#mn').value.trim();if(!n){$('#e1').textContent='اكتب اسم الدواء';return}S.meds.push({n:n,t:'حسب إرشاد الطبيب',left:100,tot:100,taken:0});draw();toast('تم حفظ الدواء ✓')}
function addAtt(){var t=$('#at').value;if(!t){$('#e1').textContent='حدد وقت النوبة';return}S.att.unshift([t.replace('T',' '),$('#as').value,$('#ac').value]);draw();toast('تم حفظ النوبة ✓')}
function addPf(){var v=+$('#pv').value;if(!v||v<50||v>900){$('#e1').textContent='أدخل قراءة منطقية بين 50 و 900';return}var d=new Date();S.pf.push([('0'+d.getDate()).slice(-2)+'/'+('0'+(d.getMonth()+1)).slice(-2),v]);draw();toast(pz(v)=='g'?'تم الحفظ: منطقة خضراء ✓':'تم الحفظ: انتبه لحالتك')}
function saveSet(){var n=$('#sn').value.trim();if(!n){$('#e1').textContent='الاسم مطلوب';return}S.user.name=n;S.user.type=$('#st').value;S.set.rem=$('#sr').checked;S.set.notes=$('#sx').checked;S.dark=$('#sd').checked;document.documentElement.setAttribute('data-theme',S.dark?'dark':'light');toast('تم حفظ التغييرات ✓')}
var KEY='asthmaApp1',LZ=null,ZD='';
function save(){try{if(S.zone!==LZ){LZ=S.zone;ZD=new Date().toDateString()}localStorage.setItem(KEY,JSON.stringify({user:S.user,zone:S.zone,zd:ZD,att:S.att,pf:S.pf,meds:S.meds,trg:S.trg,set:S.set,dark:S.dark,pfBest:S.pfBest}))}catch(e){}}
(function(){try{var d=JSON.parse(localStorage.getItem(KEY)||'null');if(!d)return;['user','att','pf','meds','trg','set','dark','pfBest'].forEach(function(k){if(d[k]!==undefined)S[k]=d[k]});if(d.zone&&d.zd===new Date().toDateString()){S.zone=d.zone;ZD=d.zd}LZ=S.zone;if(S.user)S.page='dash';if(S.dark)document.documentElement.setAttribute('data-theme','dark')}catch(e){}})();
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(function(){});
draw();loadAir();
</script>
